name: Build crDroid GSI Modules

on:
  push:
    branches: [ "16.0", "main", "12.x" ]
  pull_request:
    branches: [ "16.0" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. تفريغ مساحة القرص بأوامر سريعة وآمنة
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo apt-get clean

    # 2. جلب كود المستودع
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # 3. إعداد بيئة Java / JDK
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # 4. بناء ملفات الـ APK باستخدام Gradle
    - name: Build APKs with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "لم يتم العثور على gradlew، يرجى التأكد من رفع ملفات مشروع Gradle إلى المستودع."
          exit 1
        fi

    # 5. رفع ملفات الـ APK الناتجة لصفحة الـ Artifacts
    - name: Upload Built APKs
      uses: actions/upload-artifact@v4
      with:
        name: crDroid-GSI-APKs
        path: |
          **/build/outputs/apk/**/*.apk

