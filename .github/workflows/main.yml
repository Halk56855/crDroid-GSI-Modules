name: Build crDroid GSI Modules

on:
  push:
    branches: [ "16.0", "main", "12.x" ]
  pull_request:
    branches: [ "16.0" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. تفريغ مساحة القرص
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo apt-get clean

    # 2. جلب كود المستودع أولاً (قبل أي إعدادات تعتمد على وجود الكود)
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # 3. إعداد بيئة Java 17 عبر الإصدار v5 (بدون البحث الإجباري عن ملفات Gradle)
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 4. بناء ملفات الـ APK باستخدام Gradle (مع التحقق من وجود السكريبت)
    - name: Build APKs with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        elif [ -f "../gradlew" ]; then
          chmod +x ../gradlew
          ../gradlew assembleDebug
        else
          echo "تحذير: لم يتم العثور على سكريبت gradlew في المجلد الحالي."
          echo "سيتم تخطي خطوة البناء المباشر. تأكد من إعداد ملفات المشروع بأسلوب Gradle."
          exit 1
        fi

    # 5. رفع ملفات الـ APK الناتجة
    - name: Upload Built APKs
      uses: actions/upload-artifact@v4
      with:
        name: crDroid-GSI-APKs
        path: |
          **/build/outputs/apk/**/*.apk
